<div class="app-layout">
  <app-toast></app-toast>
  <app-navbar (toggleSidebar)="isSidebarOpen = !isSidebarOpen"></app-navbar>

  <div class="app-body">
    <div
      class="sidebar-backdrop"
      *ngIf="isSidebarOpen && showSidebar()"
      (click)="isSidebarOpen = false"
    ></div>

    <app-sidebar
      *ngIf="showSidebar() && (authService.currentUser$ | async) as user"
      [isOpen]="isSidebarOpen"
      [userRole]="user.role"
      (closeSidebar)="isSidebarOpen = false"
    ></app-sidebar>

    <main class="main-content" [class.full-width]="!showSidebar()">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
