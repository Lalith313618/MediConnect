<div class="app-layout">
  <app-toast></app-toast>
  <app-navbar (toggleSidebar)="isSidebarOpen = !isSidebarOpen"></app-navbar>

  <div class="app-body">
    <app-sidebar
      *ngIf="authService.isLoggedIn() && (authService.currentUser$ | async) as user"
      [isOpen]="isSidebarOpen"
      [userRole]="user.role"
      (closeSidebar)="isSidebarOpen = false"
    ></app-sidebar>

    <main class="main-content" [class.full-width]="!authService.isLoggedIn()">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
