<div class="auth-container">
  <div class="auth-card card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to access your MediConnect account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [class.is-invalid]="f['email'].touched && f['email'].errors"
          formControlName="email"
          placeholder="Enter Your Email Id"
        />
        <div *ngIf="f['email'].touched && f['email'].errors" class="invalid-feedback">
          <span *ngIf="f['email'].errors['required']">Email is required.</span>
          <span *ngIf="f['email'].errors['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [class.is-invalid]="f['password'].touched && f['password'].errors"
          formControlName="password"
          placeholder="Enter Your Password"
        />
        <div *ngIf="f['password'].touched && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors['required']">Password is required.</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
