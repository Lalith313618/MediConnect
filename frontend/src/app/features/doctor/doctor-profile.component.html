<div class="page-container animate-fade-in">
  <div class="page-header">
    <div>
      <h1>Doctor Professional Profile</h1>
      <p class="subtitle">Update consultation fees, qualifications, bio, specialization, and login credentials.</p>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="card text-center py-5 mt-4">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p class="mt-3 text-muted">Loading doctor credentials...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading && errorMsg" class="card text-center py-4 mt-4 border-danger">
    <p class="text-danger">{{ errorMsg }}</p>
  </div>

  <div class="card profile-card mt-3" *ngIf="!loading && doctor && doctorForm">
    <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="name">Doctor Full Name *</label>
          <input id="name" type="text" class="form-control" formControlName="name" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="phone">Phone Number</label>
          <input id="phone" type="tel" class="form-control" formControlName="phone" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="email">Login Email Address *</label>
          <input id="email" type="email" class="form-control" formControlName="email" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="password">New Password (Leave blank to keep current)</label>
          <input id="password" type="password" class="form-control" formControlName="password" placeholder="••••••••" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="specialization">Medical Specialization *</label>
          <input id="specialization" type="text" class="form-control" formControlName="specialization" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="qualification">Qualifications & Degrees</label>
          <input id="qualification" type="text" class="form-control" formControlName="qualification" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label" for="experience">Years of Experience</label>
          <input id="experience" type="number" class="form-control" formControlName="experience" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label" for="consultationFee">Consultation Fee ($)</label>
          <input id="consultationFee" type="number" class="form-control" formControlName="consultationFee" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="profileImage">Profile Image URL</label>
        <input id="profileImage" type="text" class="form-control" formControlName="profileImage" />
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Professional Summary / Bio</label>
        <textarea id="bio" rows="4" class="form-control" formControlName="bio"></textarea>
      </div>

      <div class="actions mt-4">
        <button type="submit" class="btn btn-primary" [disabled]="doctorForm.invalid || saving">
          {{ saving ? 'Saving Changes...' : 'Update Doctor Credentials' }}
        </button>
      </div>
    </form>
  </div>
</div>
