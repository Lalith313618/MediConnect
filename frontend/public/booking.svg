  <rect x="325" y="15" width="34" height="75" rx="17" fill="#334155" />
  
  <!-- Calendar Header Bar -->
  <path 
    d="M 45 110 C 45 85 65 65 90 65 H 374 C 399 65 419 85 419 110 V 210 H 45 Z" 
